name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Information Retrieval Tests
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run IR Unit Tests (Stemmer, Postings, BM25, Trie)
      run: |
        python3 -m unittest discover -s tests -v

    - name: Run IR Pipeline Demo
      run: |
        python3 scripts/demo.py
